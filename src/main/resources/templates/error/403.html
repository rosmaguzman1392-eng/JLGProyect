<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403 - Acceso Denegado</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; background: #f8f9fa; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #dc3545; font-size: 72px; margin: 0; }
        p { color: #6c757d; font-size: 18px; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>403</h1>
        <h2>Acceso Denegado</h2>
        <p th:text="${message}">No tienes los permisos necesarios.</p>
        <br>
        <a href="/login">Volver al Inicio de Sesión</a>
    </div>
</body>
</html>
